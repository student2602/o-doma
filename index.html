<body>

    <!DOCTYPE html>
    <html lang="ru">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>О дома</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="card">
            <h2 class="card-title">О дома</h2>

            <div class="form-row">
                <div class="input-group">
                    <label for="year">Год постройки</label>
                    <input type="text" id="year">
                </div>
                <div class="input-group">
                    <label for="height">Высота потолков, м</label>
                    <input type="text" id="height">
                </div>
            </div>

            <div class="form-row">
                <span class="label">Тип парковки</span>
                <div class="chips-group">
                    <label class="chip">
                        <input type="radio" name="parking" value="closed" checked>
                        <span class="chip-content">Закрытая</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="parking" value="underground">
                        <span class="chip-content">Подземная</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="parking" value="open">
                        <span class="chip-content">Открытая</span>
                    </label>
                </div>
            </div>

            <div class="form-row">
                <span class="label">Тип дома</span>
                <div class="chips-group">
                    <label class="chip">
                        <input type="radio" name="house_type" value="brick">
                        <span class="chip-content">Кирпич</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="house_type" value="monolith">
                        <span class="chip-content">Монолит</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="house_type" value="panel">
                        <span class="chip-content">Панель</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="house_type" value="brick_monolith">
                        <span class="chip-content">Кирпич-монолит</span>
                    </label>
                    <label class="chip">
                        <input type="radio" name="house_type" value="block">
                        <span class="chip-content">Блок</span>
                    </label>
                </div>
            </div>
        </div>

    </body>

    </html>

</body>

</html>
</body>

</html>
